# cargo-deny policy: run with `cargo deny check`.

[advisories]
yanked = "deny"
# Every exception is a transitive GPUI Kit 0.7.1 dependency that this crate
# cannot replace. Revisit them whenever gpui-kit is upgraded.
ignore = [
    # quick-xml 0.39 is used only by wayland-scanner, a Linux build-time proc
    # macro that parses the protocol XML bundled with it, never runtime input.
    { id = "RUSTSEC-2026-0194", reason = "build-time parsing of trusted Wayland protocol XML" },
    { id = "RUSTSEC-2026-0195", reason = "build-time parsing of trusted Wayland protocol XML" },
    # Unmaintained, without a known vulnerability.
    { id = "RUSTSEC-2024-0384", reason = "instant: transitive GPUI dependency" },
    { id = "RUSTSEC-2024-0436", reason = "paste: transitive GPUI and image dependency" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: transitive GPUI dependency" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: transitive GPUI text-shaping dependency" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: transitive GPUI text-shaping dependency" },
]

[licenses]
# Permissive licenses only, plus MPL-2.0: its file-level copyleft covers a few
# GPUI dependencies (dwrote, option-ext) and does not extend to this code.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# GPUI pulls several major versions of common crates; duplicates are expected.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
